# Workflow [No indentation required for naming the workflow]
name: hello

# On tells when the workflow should run (give indentation by tab)
on:
  workflow_dispatch:

# jobs tells what the workflow should do, there can be one or more than one jobs, hence we write jobs:
# jobs is an object so needs indentation

jobs:
# 1st job (give indentation)
say-hello:
# Creates an Ephermal Container with Ubuntu runnig

runs-on: ubuntu-latest
# that ephermal container will have steps to excute, hence name those steps and use run: run has the command

steps:
- name: Say hello to everyone
  run: echo "hello dosto"

# Jobs
# Should be inside the workflow

# Steps
# Should be insite the job

# Actions
# Should be inside the steps
